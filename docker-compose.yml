# =====================================================================
# TEAM FF | CONSULTORIA — Stack local (espelha a arquitetura da Vercel)
#   db        → PostgreSQL 16 (auto-carrega schema.sql + seed.sql)
#   frontend  → Next.js 14 (UI + API em /api via Route Handlers) :3000
#
#   Subir:    docker compose up --build
#   Acessar:  http://localhost:3000
#   Resetar:  docker compose down -v   (apaga o banco e re-semeia)
#
# Obs.: a pasta backend/ (Fastify) é uma alternativa standalone OPCIONAL e
#       NÃO é usada aqui nem na Vercel — a API roda integrada no Next.js.
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: teamff_db
    environment:
      POSTGRES_USER: teamff
      POSTGRES_PASSWORD: teamff
      POSTGRES_DB: teamff
    ports:
      - "5432:5432"
    volumes:
      - teamff_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamff -d teamff"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: teamff_frontend
    environment:
      # Route Handlers (server-side) conectam no Postgres do compose.
      DATABASE_URL: postgres://teamff:teamff@db:5432/teamff
      PUBLIC_MEDIA_BASE_URL: https://media.teamff.dev
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  teamff_pgdata:
